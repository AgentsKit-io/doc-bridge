name: Cloudflare deploy

# Deploys the docs site to the Cloudflare Worker `ak-doc-bridge` (see wrangler.toml).
# Mirrors `pnpm cf:deploy`. Never runs on pull_request, so fork code never sees credentials.
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'apps/docs/**'
      - 'docs/**'
      - 'src/**'
      - 'scripts/**'
      - 'vercel.json'
      - 'wrangler.toml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/cloudflare-deploy.yml'
  workflow_dispatch:

concurrency:
  # Deploys queue instead of cancelling one another, so a deploy is never cut off midway.
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SITE_URL: https://doc-bridge.agentskit.io/
    steps:
      - name: Check Cloudflare secrets
        id: gate
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; skipping build and deploy."
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.has_secrets == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.gate.outputs.has_secrets == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 11.19.0
      - if: steps.gate.outputs.has_secrets == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gate.outputs.has_secrets == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build docs site
        if: steps.gate.outputs.has_secrets == 'true'
        run: pnpm docs:build
      - name: Write Cloudflare headers
        if: steps.gate.outputs.has_secrets == 'true'
        run: pnpm cf:headers
      - name: Deploy Worker
        if: steps.gate.outputs.has_secrets == 'true'
        run: npx -y wrangler@4 deploy
      - name: Smoke check public site
        if: steps.gate.outputs.has_secrets == 'true'
        run: |
          ok=0
          for attempt in 1 2 3 4 5 6; do
            headers=$(curl -sS -o /dev/null -D - -w 'HTTP_CODE:%{http_code}\n' "$SITE_URL" || true)
            fail=""
            echo "$headers" | grep -q '^HTTP_CODE:200$' || fail="$fail status-not-200"
            for h in x-content-type-options x-frame-options strict-transport-security; do
              echo "$headers" | grep -qi "^$h:" || fail="$fail missing-$h"
            done
            if [ -z "$fail" ]; then ok=1; break; fi
            echo "Attempt $attempt failed:$fail; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Smoke check failed for $SITE_URL (expected HTTP 200 and security headers)"
            exit 1
          fi
          echo "Smoke check passed for $SITE_URL"
