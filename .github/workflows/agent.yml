# Factory pilot (2026-10-26): an issue labelled `agent:go` (set by the PM or a maintainer) is implemented by Claude Code
# on the self-hosted runners labelled `agent-pilot` (instabox-2, clean per job), opened as a PR and auto-merged when the
# required checks pass. Issues also labelled `risco` wait for a human merge. "@claude" in a comment by a member continues
# the work on the same issue or PR. Fork PRs never reach these runners (external contributors need approval).
name: agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: agent-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  agent:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent:go') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: [self-hosted, agent-pilot]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 11.19.0
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: Pool key (stays on the runner host, masked)
        run: |
          key=$(cat "$HOME/.pool-key")
          echo "::add-mask::$key"
          echo "POOL_KEY=$key" >> "$GITHUB_ENV"
      - id: claude
        uses: anthropics/claude-code-action@925afb53776cf1a2b738c6bdbed37b4d4000ef13 # v1
        with:
          anthropic_api_key: ${{ env.POOL_KEY }}
          label_trigger: "agent:go"
          branch_prefix: "agent/"
          settings: >-
            {"env": {"ANTHROPIC_BASE_URL": "http://100.87.168.68:8317",
                     "HTTP_PROXY": "http://127.0.0.1:8317", "HTTPS_PROXY": "http://127.0.0.1:8317",
                     "NO_PROXY": "127.0.0.1,localhost,::1"}}
          claude_args: >-
            --model sonnet --max-turns 80
            --allowedTools "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(pnpm:*),Bash(node:*),Bash(npx vitest:*),Bash(git:*),Bash(ls:*),Bash(cat:*),Bash(mkdir:*)"
            --append-system-prompt "Follow AGENTS.md (changesets, commit rules). Before finishing: pnpm typecheck and the tests of the files you changed must pass; commit everything on this branch and push it."
      - name: Open the PR and enable auto-merge
        if: github.event_name == 'issues' && steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ steps.claude.outputs.github_token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          RISK: ${{ contains(github.event.issue.labels.*.name, 'risco') }}
        run: |
          git fetch origin "$BRANCH" 2>/dev/null || { echo "no branch pushed: nothing to open"; exit 0; }
          [ "$(git rev-list --count "origin/main..origin/$BRANCH")" -gt 0 ] || { echo "branch has no commits"; exit 0; }
          pr=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          [ -n "$pr" ] || pr=$(gh pr create --head "$BRANCH" --base main --title "$TITLE" --body "Closes #$ISSUE. Implemented by the factory pilot (agent.yml)." | grep -oE '[0-9]+$')
          if [ "$RISK" = "true" ]; then gh pr edit "$pr" --add-label risco; echo "risk: waits for a human merge"; else gh pr merge "$pr" --auto --squash; fi
