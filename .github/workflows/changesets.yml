name: Changesets release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: changesets-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install pinned npm release client
        env:
          NPM_TARBALL_URL: https://registry.npmjs.org/npm/-/npm-11.18.0.tgz
          NPM_TARBALL_SHA512: T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
        run: |
          curl --fail --location --retry 3 --output npm-11.18.0.tgz "$NPM_TARBALL_URL"
          actual_sha512="$(openssl dgst -sha512 -binary npm-11.18.0.tgz | base64 -w0)"
          test "$actual_sha512" = "$NPM_TARBALL_SHA512"
          npm install --global --ignore-scripts --no-audit --no-fund ./npm-11.18.0.tgz
          hash -r
          npm --version
          rm -f npm-11.18.0.tgz
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Version or publish packages
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
          github-token: ${{ github.token }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: true
