name: Changesets release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: changesets-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      # npm is pinned by exact version; npm checks the registry tarball integrity on install.
      - name: Install pinned npm release client
        run: |
          npm install --global --ignore-scripts --no-audit --no-fund npm@11.18.0
          hash -r
          npm --version
      - run: pnpm install --frozen-lockfile
      # Production dependencies are what a consumer installs, and they are audited down to
      # the lowest severity. Development tooling is not: it never ships, and at least one of
      # its advisories (extract-zip <=2.0.1, through @lhci/cli > lighthouse > puppeteer-core)
      # has no patched release in existence, so auditing dev dependencies here made the
      # release gate unsatisfiable rather than safe. Dependabot still reports them.
      - run: pnpm audit --prod --audit-level low
      - run: pnpm typecheck
      - run: pnpm check:ecosystem-upstream --against-upstream-head
      - run: pnpm test
      - run: pnpm build
      # changesets/action 2.x renamed every script and pull-request input; the 1.x names now fail
      # the step outright. CI never exercises this workflow, so the rename only surfaced on the
      # first push to main after the major bump.
      - name: Version or publish packages
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
          github-token: ${{ github.token }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: true
