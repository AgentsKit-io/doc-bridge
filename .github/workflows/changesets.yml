name: Changesets release

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: changesets-release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
        with:
          version: 11.19.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          package-manager-cache: false
      - name: Pin npm release client
        env:
          NPM_TARBALL_URL: https://registry.npmjs.org/npm/-/npm-11.18.0.tgz
          NPM_TARBALL_SHA512: T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
        run: |
          curl --fail --location --retry 3 --output npm-11.18.0.tgz "$NPM_TARBALL_URL"
          actual_sha512="$(openssl dgst -sha512 -binary npm-11.18.0.tgz | base64 -w0)"
          test "$actual_sha512" = "$NPM_TARBALL_SHA512"
          npm_client_dir="$RUNNER_TEMP/npm-11.18.0"
          mkdir -p "$npm_client_dir"
          tar -xzf npm-11.18.0.tgz -C "$npm_client_dir" --strip-components=1
          echo "$npm_client_dir/bin" >> "$GITHUB_PATH"
          node "$npm_client_dir/bin/npm-cli.js" --version
          rm -f npm-11.18.0.tgz
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Version or publish packages
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
          github-token: ${{ github.token }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NPM_CONFIG_PROVENANCE: true
