name: CI

permissions: {}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

concurrency:
  # Supersede in-flight runs for the same PR; pushes to main and scheduled runs always finish.
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pipeline:
    uses: ./.github/workflows/ci-standard.yml
    permissions:
      actions: write
      contents: read

  action-smoke:
    needs: pipeline
    if: contains(fromJSON('["pr","full"]'), needs.pipeline.outputs.mode)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build repository index
        run: node bin/ak-docs.js index
      - name: Resolve a published version for the pre-release Action smoke
        id: published-doc-bridge
        run: echo "version=$(npm view @agentskit/doc-bridge version)" >> "$GITHUB_OUTPUT"
      # The self-smoke consumes the index generated above; the Action still defaults
      # to committed indexes for consumer repositories and does not rebuild it.
      - name: Run the public composite Action contract
        uses: ./
        with:
          config-path: doc-bridge.config.json
          package-version: ${{ steps.published-doc-bridge.outputs.version }}
          engine: checkout
          head-revision: ${{ github.sha }}

  determinism:
    name: ChangeSet determinism (${{ matrix.os }})
    needs: pipeline
    if: contains(fromJSON('["pr","full"]'), needs.pipeline.outputs.mode)
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run tests/change-set-determinism.test.ts

  docs:
    needs: pipeline
    if: github.actor != 'dependabot[bot]' && contains(fromJSON('["pr","full"]'), needs.pipeline.outputs.mode)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Lighthouse and e2e run on pushes to main and whenever the PR (or merge group) changes
      # the docs site or its build inputs; otherwise they are skipped steps, so `docs` still reports.
      - name: Detect docs site changes
        id: docs-changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            merge_group) base="$MERGE_GROUP_BASE_SHA" ;;
            *) echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          git fetch --no-tags --depth=1 origin "$base"
          git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed-files.txt"
          cat "$RUNNER_TEMP/changed-files.txt"
          CHANGED_FILES="$RUNNER_TEMP/changed-files.txt" node --input-type=module >> "$GITHUB_OUTPUT" <<'NODE'
          // Reads changed paths (one per line) from CHANGED_FILES and prints `changed=true|false`: true when a
          // path is an input of the docs site build, Lighthouse or the docs e2e suite. Only the
          // docs/ files the site publishes count, so spec or roadmap edits do not run browser checks.
          import { readFileSync } from 'node:fs'

          const published = new Set(
            ['apps/docs/public-docs.json', 'apps/docs/public-agent-docs.json'].flatMap((list) =>
              JSON.parse(readFileSync(list, 'utf8')).map((file) => `docs/${file}`),
            ),
          )
          const prefixes = ['apps/docs/', 'docs/landing/', 'tests/docs-e2e/', 'scripts/lib/']
          const files = new Set([
            'scripts/build-docs-artifacts.mjs',
            'ecosystem.json',
            'lighthouserc.json',
            'playwright.config.ts',
            'package.json',
            'pnpm-lock.yaml',
            'pnpm-workspace.yaml',
            '.github/workflows/ci.yml',
            '.github/workflows/ci-standard.yml',
          ])

          const changed = readFileSync(process.env.CHANGED_FILES, 'utf8').split('\n').map((line) => line.trim()).filter(Boolean)
          const hit = changed.find(
            (path) =>
              files.has(path) ||
              published.has(path) ||
              prefixes.some((prefix) => path.startsWith(prefix)) ||
              (path.startsWith('docs/') && path.endsWith('/meta.json')),
          )
          if (!hit) console.error('::notice::No docs site inputs changed; skipping Lighthouse and docs e2e.')
          else console.error(`Docs site input changed: ${hit}`)
          console.log(`changed=${Boolean(hit)}`)
          NODE
      - run: pnpm docs:typecheck
      - run: pnpm docs:build
      - run: pnpm test:docs-artifacts
      - if: steps.docs-changes.outputs.changed == 'true'
        run: pnpm docs:lighthouse
      - name: Upload Lighthouse reports
        if: always() && steps.docs-changes.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-reports
          path: .lighthouseci
          include-hidden-files: true
          retention-days: 7
      - if: steps.docs-changes.outputs.changed == 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.docs-changes.outputs.changed == 'true'
        run: pnpm docs:e2e

  # Keeps the required check name `test`: green only when the pipeline and the product jobs
  # it covered passed (skipped on drafts).
  test:
    needs: [pipeline, action-smoke, determinism]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Pipeline and product job results
        env:
          PIPELINE: ${{ needs.pipeline.result }}
          ACTION_SMOKE: ${{ needs.action-smoke.result }}
          DETERMINISM: ${{ needs.determinism.result }}
          MODE: ${{ needs.pipeline.outputs.mode }}
        run: |
          echo "pipeline: $PIPELINE (mode: ${MODE:-unknown}); action-smoke: $ACTION_SMOKE; determinism: $DETERMINISM"
          test "$PIPELINE" = success
          for result in "$ACTION_SMOKE" "$DETERMINISM"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
