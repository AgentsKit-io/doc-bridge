name: Deploy docs (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      - scripts/cloudflare-headers.mjs
      - wrangler.toml
      - package.json
      - pnpm-lock.yaml
      - .github/workflows/deploy-docs-cloudflare.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel a deploy mid-flight; queue the next one instead.
  group: deploy-docs-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can target any ref; production deploys come from main only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      # Set the repository variable DOCS_SMOKE_URL to smoke the Worker URL directly.
      SMOKE_URL: ${{ vars.DOCS_SMOKE_URL || 'https://doc-bridge.agentskit.io' }}
    steps:
      - name: Check Cloudflare credentials
        id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets are not configured; skipping docs deploy."
          fi
      - if: steps.creds.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.creds.outputs.present == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4
        with:
          version: 11.19.0
      - if: steps.creds.outputs.present == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - if: steps.creds.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      # Same steps as `pnpm cf:deploy`, split so the secrets reach only the deploy step.
      - if: steps.creds.outputs.present == 'true'
        run: pnpm docs:build
      - if: steps.creds.outputs.present == 'true'
        run: pnpm cf:headers
      - name: Deploy to Cloudflare Workers
        if: steps.creds.outputs.present == 'true'
        run: npx -y wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke check the public site
        if: steps.creds.outputs.present == 'true'
        run: |
          ok=0
          for attempt in 1 2 3 4 5; do
            status=$(curl -sS -o /dev/null -D headers.txt -w '%{http_code}' "$SMOKE_URL" || true)
            if [ "$status" = "200" ] \
              && grep -qi '^x-content-type-options:' headers.txt \
              && grep -qi '^x-frame-options:' headers.txt \
              && grep -qi '^strict-transport-security:' headers.txt; then
              ok=1
              break
            fi
            echo "Attempt $attempt: HTTP $status, expected 200 plus security headers; retrying in 15s"
            sleep 15
          done
          if [ "$ok" != 1 ]; then
            echo "::error::Smoke check failed for $SMOKE_URL (need HTTP 200, X-Content-Type-Options, X-Frame-Options, Strict-Transport-Security)"
            cat headers.txt
            exit 1
          fi
          echo "Smoke check passed for $SMOKE_URL"
