name: doc-bridge CodeQL config
# Generated build output is analysed through its sources instead:
# apps/docs/public/figures/*.html is built by scripts/figures/** (which stays in scope)
# and inlines a vendored drawing kit, so findings there duplicate or come from vendored code.
paths-ignore:
  - apps/docs/public/figures/**
# ci-standard/** is the platform CI template, synced verbatim (ci-template-sync);
# edits belong upstream, so it stays out of this repo's code scanning.
  - ci-standard/**
