# MVP do doc-bridge (lista aprovada pelo dono em 01/11/2026): lista curta, só o que os produtos consumidores precisam antes de
# lançar. Não é uma lista de 1.0 nem de 3.0.
# Decisão do dono: as bibliotecas de base não ganham lista completa; cada uma lista de 5 a 12 itens.
# Base: um produto consumidor incorpora a Camada 1 (determinística, sem LLM) como serviço: descobre o repositório na
# base e na cabeça de uma mudança, faz o diff (ChangeSetV1) e propõe correções de docs. O piloto roda sobre três
# repositórios públicos do ecossistema: doc-bridge, agentskit-chat e agentskit.
# Fora da lista (um por linha):
#   - Camada 2 (LLM) e remediação com LLM;
#   - Obsidian/vault, grafo de conhecimento, studio;
#   - estudos e benchmark de contexto para agentes (fora o de precisão da Camada 1);
#   - TypeScript 7 (#409) e otimizações de CI (#434) e de índice (#394);
#   - cruzamento entre repositórios.
# Aprovação: approval.digest é o digest desta lista (ak-harness mvp digest / mvp_manifest.py digest); mudou a lista, precisa aprovar de novo.
version: 1
product: doc-bridge
repo: AgentsKit-io/doc-bridge
source: uso de @agentskit/doc-bridge como motor da Camada 1 num produto consumidor + decisão do dono (lista curta)
approval:
  by: EmersonBraun
  at: "2026-11-01T02:00:00Z"
  digest: 642bbeb89fbbd913
requirements:
- id: RF-01
  title: Versão publicada com o conserto do ranking
  done_when: >-
    O workflow de release (Changesets) fica verde na main e o npm tem uma versão acima de 2.5.1 com o conserto do
    ranking de busca (#441) e as mudanças pendentes
  weight: 2
  acceptance:
    - tests/retrieval-projection.test.ts > explainable ranking > lets the strongest lexical hits corroborate each other through their relations
    - tests/retrieval-projection.test.ts > explainable ranking > answers the workflow question within the top three, and says why
    - tests/bench-retrieval.test.ts > bench CLI > measures the committed suite against the committed baseline and exits zero
  homolog:
    - npm @agentskit/doc-bridge@2.6.0 (latest, publicado em 2026-11-02) com o conserto do ranking (#441) no CHANGELOG
    - workflow "Changesets release" verde na main em f4bd3b0 (#457) e "Release stable package" verde em v2.6.0
  issues: [445]
  prs: [441, 454, 457]
- id: RF-02
  title: Camada 1 de ponta a ponta no perfil de serviço
  done_when: >-
    Pela API pública (discoverRepositoryWithRead e diffSnapshotsWithRead com profile service e limites maxFiles,
    maxBytes e maxTimeMs), um teste descobre a base e a cabeça de um repositório de exemplo e gera o ChangeSetV1 sem
    git, sem rede e sem executar código do repositório, com segredos redigidos
  # já pronto em parte: perfil de serviço (ADR 0012) e IO plugável (ADR 0014); falta o teste de ponta a ponta do diff
  weight: 2
  acceptance: []
  homolog: []
  issues: []
  prs: []
- id: RF-03
  title: Repositório hostil termina em falha explícita
  done_when: >-
    Um repositório de teste hostil (arquivo grande demais, config com chaves de execução ou rede, .git forjado,
    instruções embutidas em docs) roda pelo perfil de serviço e termina em erro tipado ou em cobertura parcial
    declarada, nunca em sucesso silencioso nem em código executado
  weight: 2
  acceptance:
    - "tests/service-hostile-repository.test.ts > hostile repository under the service profile (RF-03) > ends in declared partial coverage, never silent success, and runs no repository code"
    - "tests/service-hostile-repository.test.ts > hostile repository under the service profile (RF-03) > treats instructions embedded in docs as data: deterministic findings, declared coverage, nothing executed or fetched"
    - "tests/service-hostile-repository.test.ts > hostile repository under the service profile (RF-03) > never reads the forged .git: a direct read is a typed denial and no git process starts"
    - "tests/service-hostile-repository.test.ts > hostile repository under the service profile (RF-03) > ends in a typed error when the checkout holds a file the caller did not pin"
  homolog: []
  issues: [447]
  prs: []
- id: RF-04
  title: Diff entre dois checkouts sem depender do nome da pasta
  done_when: >-
    Quem chama informa a identidade do projeto para a base e a cabeça; o diff funciona com pastas de nomes
    diferentes e identidades diferentes dão um erro tipado; teste para os dois casos
  weight: 1
  acceptance:
    - tests/change-set.test.ts (diffs checkouts in differently named folders when the caller declares the same identity; throws a typed error when the declared identities differ)
  homolog: []
  issues: []
  prs: []
- id: RF-05
  title: Resultado determinístico
  done_when: >-
    A mesma base, cabeça e configuração geram o mesmo contentHash do ChangeSetV1 em duas execuções e em Linux e
    macOS; teste no CI
  weight: 1
  acceptance: []
  homolog: []
  issues: []
  prs: []
- id: RF-06
  title: Precisão da Camada 1 medida por tipo de achado
  done_when: >-
    Um benchmark com mutações sintéticas (remoção e renome de símbolos, flags e chaves) sobre cópias dos três
    repositórios públicos do piloto publica a precisão por tipo; só os tipos com 95% ou mais ficam marcados como
    elegíveis para correção automática
  weight: 2
  acceptance:
