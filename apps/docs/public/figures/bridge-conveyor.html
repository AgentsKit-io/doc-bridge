/* Bridge-conveyor figure. Dark is a blue-black card that matches the AgentsKit sibling cards; light is paper. */
html.iso{
  --anatomy-page:transparent;--anatomy-card:#0e1219;--anatomy-paper:#0e1219;--anatomy-face:#161c25;--anatomy-top:#171e27;
  --anatomy-shade-0:#0a0d12;--anatomy-shade-1:#0d1117;--anatomy-shade-2:#10151c;--anatomy-shade-3:#131922;
  --anatomy-lit-top:#1e2733;--anatomy-lit-shade:#18202b;
  --anatomy-hi:#dbe3ec;--anatomy-mid:#7c8794;--anatomy-lo:#4b5562;--anatomy-faint:#2a323d;--anatomy-lit:#ffffff;
  --anatomy-text:#a8b1bb;--anatomy-strong:#e6edf3;--anatomy-muted:#7d8792;--anatomy-dot:#e6edf3;
  --anatomy-halo:#000000;--anatomy-halo-opacity:.85;
  --anatomy-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --bc-border:#30363d;--bc-radius:20px;
  --bc-on:#22d3ee;--bc-on-core:#a5f3fc;--bc-on-glow:#06b6d4;--bc-on-face:#12667a;--bc-on-shade:#0d4a59;--bc-on-deep:#0e7490;
  --bc-amber:#f0a630;--bc-amber-core:#ffe0a8;--bc-amber-face:#8a5a12;--bc-amber-shade:#66420c;--bc-amber-deep:#9a5b06;
  --bc-brass-top:#3d3a30;--bc-brass:#2c2a23;

}

  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#e9edf1;

html,body{margin:0;background:transparent}
.bc-body{color:var(--anatomy-text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.bc-page{box-sizing:border-box;width:100%;margin:0 auto;padding:2px}
.bc-figure{margin:0}
.bc-plate{display:flex;flex-direction:column;gap:6px;padding:18px 22px 16px;border-radius:var(--bc-radius);background:var(--anatomy-card);box-shadow:0 0 0 1px var(--bc-border);overflow:hidden}
.bc-top,.bc-bottom{display:flex;justify-content:space-between;align-items:center;gap:8px 16px;min-height:26px}
.bc-left{display:flex;align-items:center;gap:12px;min-width:0}
.bc-corner{color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:11.5px;line-height:1.35;letter-spacing:.06em}
.bc-corner[data-corner="fig"]{color:var(--anatomy-strong)}
.bc-corner[data-corner="title"],.bc-corner[data-corner="hint"]{text-transform:uppercase;letter-spacing:.14em}
.bc-corner[data-corner="readout"]{color:var(--anatomy-strong);font-variant-numeric:tabular-nums;text-align:right;letter-spacing:.02em}
.bc-plate[data-phase="drift"] .bc-corner[data-corner="readout"]{color:var(--bc-amber)}
.bc-crop-only{display:none}
.bc-stage{position:relative;margin:0 -6px;overflow:hidden}
.bc-stage .iso-svg{width:100%;display:block;overflow:hidden}
/* Lines the phone crop would cut have a faded twin; each frame shows its own copy. */
.bc-plate[data-frame="crop"] .bc-frame-wide,.bc-plate:not([data-frame="crop"]) .bc-frame-crop{display:none}
.bc-hots{position:absolute;inset:0;pointer-events:none}
.bc-hot{position:absolute;pointer-events:auto;margin:0;padding:0;border:0;border-radius:8px;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bc-hot:focus-visible{outline:2px solid var(--bc-on);outline-offset:2px}
.bc-pause{display:inline-flex;align-items:center;gap:7px;flex:none;min-height:28px;padding:4px 11px 4px 9px;border:1px solid var(--bc-border);border-radius:999px;background:transparent;color:var(--anatomy-text);font-family:var(--anatomy-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.bc-pause:hover{color:var(--anatomy-strong);border-color:var(--anatomy-mid)}
.bc-pause:focus-visible{outline:2px solid var(--bc-on);outline-offset:2px}
.bc-pause-icon{position:relative;width:8px;height:9px}
.bc-pause-icon::before,.bc-pause-icon::after{content:"";position:absolute;top:0;width:2.5px;height:9px;border-radius:1px;background:currentColor}
.bc-pause-icon::before{left:0}.bc-pause-icon::after{right:0}
.bc-plate[data-paused] .bc-pause-icon::before{left:1px;width:0;height:0;border-radius:0;background:none;border-style:solid;border-width:4.5px 0 4.5px 7.5px;border-color:transparent transparent transparent currentColor}
.bc-plate[data-paused] .bc-pause-icon::after{display:none}
[hidden]{display:none!important}
.bc-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* The river and the belt. */
.bc-water>.iso-fill,.bc-water>.iso-top{fill:var(--bc-water)}
.bc-flow{opacity:.85}
.bc-water>.iso-shade{fill:color-mix(in srgb,var(--bc-water) 80%,#000)}
.bc-belt>.iso-top,.bc-belt>.iso-fill{fill:var(--anatomy-shade-1)}
.bc-hole{fill:var(--bc-hole)}
.bc-brass>.iso-top,.bc-brass>.iso-fill{fill:var(--bc-brass-top)}
.bc-brass>.iso-shade{fill:var(--bc-brass)}
/* The drawbridge's amber bands on the leaf's free end, and the warning lamp on the hinge block: amber, and only
   while the leaf is raised (opacity is live). */
.bc-hazard{fill:var(--bc-amber);stroke:none;opacity:.9}
.bc-hlamp{fill:var(--bc-amber);filter:drop-shadow(0 0 3px color-mix(in srgb,var(--bc-amber) 80%,transparent))}
.bc-hlamp-core{fill:var(--bc-amber-core)}
.bc-clip{fill:var(--anatomy-shade-2)}
.bc-sign-face,.bc-plate-face{fill:var(--bc-sign)}
.bc-code{fill:var(--anatomy-hi);font-family:var(--anatomy-mono)}

/* Glow means on: label plates of indexed documents, the cards on the belt, the scan curtain, the lamps. */
.bc-glow{fill:var(--bc-on-glow);stroke:var(--bc-on-glow);stroke-width:2.6;stroke-linejoin:round;opacity:.55;filter:blur(2.2px);transition:opacity .4s ease}
html.iso[data-theme="light"] .bc-glow{opacity:.45;filter:blur(2px)}
/* Healthy labels breathe a little: --bc-breath runs 0..1 and is written by the live code. */
.bc-glow:not(.bc-stale){opacity:calc(.5 + var(--bc-breath,.5)*.14)}
html.iso[data-theme="light"] .bc-glow:not(.bc-stale){opacity:calc(.4 + var(--bc-breath,.5)*.12)}
.bc-glow.bc-flash{opacity:1!important}
.bc-cleat{stroke-width:1.5px;vector-effect:non-scaling-stroke;opacity:.9}
path.bc-label{fill:var(--bc-on);stroke:var(--bc-on-core);stroke-width:.35;vector-effect:non-scaling-stroke}
path.bc-label.bc-stale{fill:var(--bc-amber);stroke:var(--bc-amber-core)}
.bc-glow.bc-stale{fill:var(--bc-amber);stroke:var(--bc-amber)}
.bc-card>.iso-solid>.iso-top,.bc-card .iso-top{fill:var(--bc-card-top)}
.bc-card-label{fill:var(--bc-on);stroke:var(--bc-on-core);stroke-width:.3;vector-effect:non-scaling-stroke}
.bc-card-glow{fill:var(--bc-on-glow);stroke:var(--bc-on-glow);stroke-width:2;opacity:.5;filter:blur(1.6px)}
.bc-card.bc-stale .iso-top{fill:var(--bc-amber-face)}
.bc-card.bc-stale .iso-shade{fill:var(--bc-amber-shade)}
.bc-card.bc-stale .iso-edge{stroke:var(--bc-amber)}
.bc-card.bc-stale .bc-card-label{fill:var(--bc-amber);stroke:var(--bc-amber-core)}
.bc-card.bc-stale .bc-card-glow{fill:var(--bc-amber);stroke:var(--bc-amber);opacity:.7}
.bc-card.bc-stale{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--bc-amber) 70%,transparent))}
.bc-curtain{fill:var(--bc-on-glow);opacity:.16;transition:fill .4s ease}
html.iso[data-theme="light"] .bc-curtain{opacity:.2}
.bc-plate[data-flag] .bc-curtain{fill:var(--bc-amber)}
.bc-scanline{fill:none;stroke:var(--bc-on);stroke-width:1.3px;vector-effect:non-scaling-stroke;stroke-linecap:round}
.bc-plate[data-flag] .bc-scanline{stroke:var(--bc-amber)}
.bc-pennant{fill:var(--bc-amber);stroke:var(--bc-amber-deep);stroke-width:.5px;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.bc-lamp,.bc-alamp{fill:var(--bc-on)}
.bc-lamp-core,.bc-alamp-core{fill:var(--bc-on-core)}
.bc-plate[data-flag] .bc-alamp{fill:var(--bc-amber)}
.bc-plate[data-flag] .bc-alamp-core{fill:var(--bc-amber-core)}
.bc-alamp,.bc-alamp-core{transition:fill .35s ease}
.bc-lamp-halo{fill:var(--bc-on-glow);filter:blur(7px)}
.bc-led{fill:var(--bc-on)}
.bc-index .iso-fill,.bc-index .iso-top{transition:fill .35s ease}
.bc-index.bc-on .iso-top,.bc-index.bc-on .iso-fill{fill:var(--bc-on-face)}
.bc-index.bc-on .iso-shade{fill:var(--bc-on-shade)}
.bc-index.bc-on .iso-edge{stroke:var(--bc-on)}
.bc-index.bc-stale .iso-top,.bc-index.bc-stale .iso-fill{fill:var(--bc-amber-face)}
.bc-index.bc-stale .iso-shade{fill:var(--bc-amber-shade)}
.bc-index.bc-stale .iso-edge{stroke:var(--bc-amber)}
.bc-glass{fill:var(--bc-glass)}
.bc-well{fill:var(--anatomy-shade-1)}
.bc-screen-glow{fill:var(--bc-on-glow);filter:blur(2.5px)}
.bc-text{fill:var(--bc-on-core);font-family:var(--anatomy-mono);letter-spacing:.01em}
.bc-text.bc-dim{fill:#5f6b78}
.bc-slip-rule{fill:none;stroke:var(--bc-on);stroke-width:.5px;vector-effect:non-scaling-stroke;opacity:.7}
/* Hover or focus on an in-figure button outlines the part it acts on. */
.bc-plate[data-hover="code"] [data-name="sign.tab"] .iso-edge,
.bc-plate[data-hover="archcode"] [data-name="arch.plate"] .iso-edge,
.bc-plate[data-hover="guide"] [data-name="cab.guide"] .iso-edge,
.bc-plate[data-hover="page"] [data-name="pile.guide"] .iso-edge,
.bc-plate[data-hover="terminal"] [data-name="term.case"] .iso-edge,
.bc-plate[data-hover="held"] .bc-card.bc-stale .iso-edge{stroke:var(--bc-on)}
@media (max-width:480px){

  .bc-bottom{flex-direction:column;align-items:stretch;gap:8px}
  .bc-corner[data-corner="readout"]{text-align:left}
  .bc-corner{font-size:11px}
  .bc-wide-only{display:none}

      <svg xmlns="http://www.w3.org/2000/svg" class="iso-svg" viewBox="-5 -5 1209 504" role="img" aria-label="An isometric bridge over a river. On the left bank lies a messy pile of loose pages, markdown files and code printouts, with a code sheet that shows the signature of send. A conveyor belt carries the pages across the bridge one by one as neat index cards, through an inspection arch at mid-span that checks each card against the code, and over the last span of the bridge, a drawbridge leaf, into a card catalog on the right bank, where the cards are filed into drawers with glowing label plates under a lit PUBLISH lamp. An agent terminal beside the catalog pulls the sending-notifications card and shows docs/guides/sending-notifications.md line 8. When the code changes, the arch raises an amber flag, the card for the guide turns amber, the drawbridge rises on its hinge with an amber warning lamp lit and amber bands on its end, the belt holds the amber card just before the hinge, and the PUBLISH lamp goes out: one CHANGED_REFERENCE finding blocks publication until the guide is fixed, and then the drawbridge lowers."><path class="iso-halo" d="M19.6 292.8L20.2 290L21.6 287.4L23.8 285L26.7 282.9L30.3 281.2L34.3 279.9L38.6 279.2L1110.4 162.8L1114.8 162.6L1119.3 163L1123.6 163.8L1127.5 165.2L1130.9 167L1133.7 169.2L1135.7 171.6L1137 174.3L1180 324.6L1180.4 327.4L1180.4 341.9L1179.8 344.6L1178.4 347.3L1176.2 349.7L1173.3 351.8L1169.7 353.5L1165.7 354.7L1161.4 355.5L89.6 471.8L85.2 472.1L80.7 471.7L76.4 470.9L72.5 469.5L69.1 467.7L66.3 465.5L64.3 463L63 460.4L20 310L19.6 307.3Z"/><g class="iso-solid"><path class="iso-fill" d="M1075.9 207.5L1076.5 205.3L1077.9 203.3L1079.9 201.4L1082.6 200L1085.8 198.9L1089.2 198.2L1092.8 198.1L1096.3 198.5L1099.7 199.3L1102.6 200.6L1105 202.2L1106.8 204.1L1107.8 206.3L1108 208.5L1108 211.4L1107.5 213.6L1106.1 215.6L1104 217.4L1101.4 218.9L1098.2 220L1094.8 220.6L1091.2 220.8L1087.6 220.4L1084.3 219.6L1081.4 218.3L1078.9 216.7L1077.2 214. // The drawbridge leaf on the last span and the PUBLISH lamp are the opt-in `reference-findings` gate
// (docs/guides/publication-gate.md, ADR 0025): while a CHANGED_REFERENCE finding is pending,
// `ak-docs index` refuses to write llms.txt, the index and the capabilities file, so the drawbridge is
// raised (`barrier: "down"` in the verdict), the belt holds and the lamp is out.
//
// The names and values come from the small demo repository used in talks: the guide
// docs/guides/sending-notifications.md cites `send` on line 8, and the code change is
// send(to, text) -> send({ to, text, channel }).

  guide: {
    doc: "docs/guides/sending-notifications.md",
    line: 8,
    symbol: "send",
    // The guide's drawer: the middle one, right above the end of the belt.
    drawer: { row: 1, column: 1 },
  },
  versions: ["send(to, text)", "send({ to, text, channel })"],
  finding: "CHANGED_REFERENCE",
};

const PHASES = ["baseline", "asked", "drift", "fixed"];

/** Baseline: the guide cites the signature the code has; nothing has been asked. */
function initial() {
  return { code: 0, doc: 0, asked: false, changed: false };
}

/** An agent asks where `send` is documented. While publication is blocked nothing is delivered. */
function ask(state) {
  return { ...state, asked: true };
}

/** The code sheet flips the signature to its other version. The guide still cites the old one. */
function toggleCode(state) {
  return { ...state, code: (state.code + 1) % MODEL.versions.length, asked: false, changed: true };
}

/** The guide is fixed: it now cites the signature the code has. */
function fixDoc(state) {
  if (state.doc === state.code) return state;
  return { ...state, doc: state.code, asked: false };
}

/** Back to the baseline (the tour's quiet reset between loops). */
function reset() {
  return initial();
}

/** What the gate says about a state, and what the figure shows for it. */

  const phase = !published ? "drift" : delivered ? "asked" : state.changed ? "fixed" : "baseline";

    ? `${findings} finding · ${MODEL.finding} · publish blocked`
    : delivered
      ? `asked · ${slipOf()}`
      : phase === "fixed"
        ? "0 findings · published"
        : "index current · published";
  return {
    phase,
    findings,
    published,
    delivered,
    lamp: published,
    barrier: published ? "up" : "down",
    belt: published ? "running" : "held",
    flag: !published,
    stale: !published,
    code: MODEL.versions[state.code],
    cites: MODEL.versions[state.doc],
    slip: delivered ? slipOf() : null,
    readout,
  };

//

  if (v.phase === "fixed") return `The guide now cites ${VERSIONS[st.doc]}. No findings; the drawbridge lowers and the index is published.`;
  return "The belt files every page into the index, and the index is published.";
}
function showCode(index) {
  codes.forEach((el) => (el.style.display = Number(el.dataset.code) === index ? "" : "none"));
  archCodes.forEach((el) => (el.style.display = Number(el.dataset.archcode) === index ? "" : "none"));
}

const follow = (x, target, dt, tau, calm) => {
  if (calm) return target;
  const next = x + (target - x) * (1 - Math.exp(-dt / tau));
  return Math.abs(target - next) < 0.002 ? target : next;
};
const smooth = (t) => t * t * (3 - 2 * t);
const clamp01 = (t) => Math.max(0, Math.min(1, t));
const shiftOf = (by) => {
  const m = translateAlong(P, by).match(/translate\(([-\d.e]+)[ ,]+([-\d.e]+)\)/);
  return m ? [Number(m[1]), Number(m[2])] : [0, 0];
};
const X1 = shiftOf([1, 0, 0]);
const Z1 = shiftOf([0, 0, 1]);
const signBox = sign.getBBox();
const signHinge = signBox.y;

function draw() {
  // Belt and cards.
  const c = ((u % B.cleat) + B.cleat) % B.cleat;
  drawLeaf(motion.bar, c);
  cleats.setAttribute("transform", `translate(${(X1[0] * c).toFixed(2)} ${(X1[1] * c).toFixed(2)})`);
  // The arch's scan brightens as a card passes under it.
  let pass = 0;
  cards.forEach((el, i) => {
    const s = posOf(i);
    if (!still.matches && s <= B.slot) pass = Math.max(pass, Math.exp(-(((s - B.arch) / 11) ** 2)));
  });
  scanline.style.opacity = (0.5 + 0.5 * pass).toFixed(3);
  scanline.style.strokeWidth = `${(1.3 + 1.2 * pass).toFixed(2)}px`;
  curtain.style.opacity = (0.14 + 0.3 * pass).toFixed(3);
  svg.style.setProperty("--bc-breath", (0.5 + 0.5 * Math.sin(clock * 1.25)).toFixed(3));
  cards.forEach((el, i) => {
    const s = posOf(i);
    if (s > B.slot) {
      el.setAttribute("transform", "translate(-9999 0)");
      return;
    }
    el.setAttribute("transform", `translate(${(X1[0] * s).toFixed(2)} ${(X1[1] * s).toFixed(2)})`);
    cardBodies[i].classList.toggle("bc-stale", i === heldCard && flagged);
  });
  // The page in the hopper sinks before each card leaves the intake, then a new one fades in.
  const p = (((u % B.pitch) + B.pitch) % B.pitch) / B.pitch;
  const sink = p < 0.55 ? 0 : p < 0.95 ? smooth((p - 0.55) / 0.4) : 1;
  const show = p < 0.35 ? smooth(p / 0.35) : p < 0.95 ? 1 : 0;
  const d = DATA.feed.sink * sink;
  const ax = DATA.feed.axis;
  const off = shiftOf([ax[0] * -d, ax[1] * -d, ax[2] * -d]);
  feed.setAttribute("transform", `translate(${off[0].toFixed(2)} ${off[1].toFixed(2)})`);
  feed.style.opacity = (still.matches ? 1 : show).toFixed(3);
  // Drawer and its card.
  const dx = -motion.drawer * DATA.drawer.travel;
  const shift = shiftOf([dx, 0, 0]);
  drawerEl.setAttribute("transform", `translate(${shift[0]} ${shift[1]})`);
  holdStill(drawerEl, shift);
  boxEl.style.visibility = motion.drawer > 0.01 ? "visible" : "hidden";
  const lift = motion.lift * DATA.drawer.lift;
  dcardEl.setAttribute("transform", `translate(${(Z1[0] * lift).toFixed(2)} ${(Z1[1] * lift).toFixed(2)})`);
  const stale = v.phase === "drift";
  dcard.classList.toggle("bc-stale", stale && motion.lift > 0.02);
  dcard.classList.toggle("bc-on", !stale && motion.lift > 0.02);
  for (const el of guideLabels) el.classList.toggle("bc-stale", stale);
  for (const el of glows) {
    const left = flashes.get(el.dataset.label) || 0;
    el.classList.toggle("bc-flash", left > 0);
  }
  // Lamps, flag. The hinge lamp is amber and lit only while the drawbridge is raised.
  lampEls[0].style.opacity = (0.92 * motion.lamp).toFixed(3);
  lampEls[1].style.opacity = (0.95 * motion.lamp).toFixed(3);
  lampEls[2].style.opacity = (0.55 * motion.lamp).toFixed(3);
  hingeLampEls[0].style.opacity = (0.95 * smooth(motion.bar)).toFixed(3);
  hingeLampEls[1].style.opacity = smooth(motion.bar).toFixed(3);
  const rise = (smooth(motion.flag) - 1) * DATA.flag.rise;
  flag.setAttribute("transform", `translate(${(Z1[0] * rise).toFixed(2)} ${(Z1[1] * rise).toFixed(2)})`);
  card.toggleAttribute("data-flag", flagged);
  // The code sheet flips; the arch's plate changes with it.
  const flip = motion.flip;
  const s = flip < 0.5 ? 1 - smooth(flip * 2) : smooth((flip - 0.5) * 2);
  if (flip >= 0.5) showCode(pendingCode);
  sign.setAttribute("transform", flip >= 1 ? "" : `translate(0 ${signHinge.toFixed(2)}) scale(1 ${Math.max(0.04, s).toFixed(3)}) translate(0 ${(-signHinge).toFixed(2)})`);
  // Terminal.
  for (const [name, el] of Object.entries(screens)) el.style.display = name === (screenMode === "waiting" ? "idle" : screenMode) ? "" : "none";
  screenGlow.style.opacity = (screenMode === "slip" ? 0.32 + 0.4 * motion.glow : screenMode === "blocked" ? 0.05 : 0.14).toFixed(3);
  led.style.opacity = v.published ? (0.55 + 0.45 * motion.glow).toFixed(3) : "0.12";
  card.dataset.screen = screenMode;
}


// ---------------------------------------------------------------- the drawbridge leaf: boxes turning about the hinge
// leaf.mjs rebuilds the leaf's shaded boxes (back layer and the near rail in the front layer) at the angle
// motion.bar sets (0 down and flush, 1 raised); its amber bands on the free end fade in as it rises.
const LF = DATA.leaf;
let leafDrawn = "";
function drawLeaf(up, phase) {
  const lift = smooth(up);
  const key = `${lift.toFixed(4)}|${phase.toFixed(2)}`;
  if (key === leafDrawn) return;
  leafDrawn = key;
  const theta = lift * LF.raised;
  leafBack.innerHTML = leafSvg(LF.spec, theta, P, "back", phase);
  leafFront.innerHTML = leafSvg(LF.spec, theta, P, "front", phase);
  const hazard = leafBack.querySelector('[data-part="leaf-hazard"]');
  if (hazard) hazard.style.opacity = lift.toFixed(3);
}
// A card on the leaf keeps it down: it only rises once the leaf is clear.
const onLeaf = () => cards.some((el, i) => {
  const s = posOf(i);
  return s <= B.slot && s + B.half > LF.x0 && s - B.half < LF.x1;
});

// ---------------------------------------------------------------- the loop
let frame = 0;
let last = 0;
let visible = false;
let paused = false;
let held = false; // hover or focus
let acting = false; // a click or hook runs the loop until the scene settles, even while paused
let idleUntil = 0;
let tourClock = 0;
let clock = 0; // seconds the figure has been running, for the labels' slow breathing
const DWELL = { baseline: 6, asked: 4.2, drift: 5.2, fixed: 3.2 };
const touring = () => !still.matches && !paused && !held && performance.now() > idleUntil;
const beltLive = () => !still.matches && (!paused || acting);
const isSettled = () => motion.drawer === targets().drawer && motion.bar === targets().bar && motion.flag === targets().flag && (v.phase !== "drift" || Math.abs(u - holdU) < 0.05);

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  const calm = still.matches;
  if (!calm) clock += dt;
  if (touring()) {
    tourClock += dt;
    const settled = v.phase !== "drift" || (heldCard >= 0 && Math.abs(u - holdU) < 0.05);
    if (tourClock > DWELL[v.phase] && slipAt < 0 && screenMode !== "waiting" && settled) {
      tourClock = 0;
      setState(tourStep(st));
    }
  }
  // The belt runs while publication is allowed; a finding holds it with the guide's card on the deck just
  // before the hinge, and the drawbridge rises once no card is on the leaf.
  const before = u;
  if (heldCard >= 0) {
    if (v.phase === "drift") {
      const left = holdU - u;
      const want = calm ? 0 : Math.max(0, Math.min(B.speed, left * 1.4));
      speed = follow(speed, want, dt, 0.25, calm);
      if (calm) u = holdU;
      else u = Math.min(holdU, u + (beltLive() ? speed : 0) * dt);
      if (posOf(heldCard) > B.arch + 2 || calm) flagged = true;
    } else if (motion.bar < 0.04) {
      heldCard = -1;
    }
  } else if (!calm) {
    speed = follow(speed, beltLive() ? B.speed : 0, dt, 0.35, calm);
    u += speed * dt;
  }
  // A card that slides into the slot is filed: its drawer's label brightens for a moment.
  if (u > before) {
    for (let i = 0; i < N; i++) {
      const a = posOf(i, before);
      const b = posOf(i, u);
      if (a < B.slot - 6 && b >= B.slot - 6 && b > a) {
        const lap = Math.floor((u - i * B.pitch) / CYCLE);
        const index = String(i === heldCard || (i * 5 + lap) % 3 === 0 ? guideIndex : (i * 4 + lap * 2) % DATA.labels);
        flashes.set(index, 0.9);
      }
    }
  }
  for (const [key, left] of flashes) {
    if (left - dt <= 0) flashes.delete(key);
    else flashes.set(key, left - dt);
  }
  const want = targets();
  motion.drawer = follow(motion.drawer, want.drawer, dt, 0.24, calm);
  motion.lift = follow(motion.lift, want.drawer ? want.lift : 0, dt, 0.18, calm);
  if (!want.drawer && motion.lift > 0.02) motion.drawer = Math.max(motion.drawer, 0.85);
  motion.lamp = follow(motion.lamp, want.lamp, dt, want.lamp ? 0.3 : 0.18, calm);
  motion.bar = follow(motion.bar, want.bar, dt, 0.28, calm);
  motion.flag = follow(motion.flag, want.flag, dt, 0.22, calm);
  if (motion.flip < 1) motion.flip = calm ? 1 : Math.min(1, motion.flip + dt / 0.42);
  // The slip shows on the terminal once the card is up.
  if (screenMode === "waiting" && motion.lift > 0.92 && slipAt < 0) slipAt = 0;
  if (slipAt >= 0) {
    slipAt += dt;
    if (slipAt >= 0.5) {
      slipAt = -1;
      screenMode = "slip";
      motion.glow = 1;
      readout.textContent = v.readout;
    }
  }
  motion.glow = follow(motion.glow, 0, dt, 0.9, calm);
  if (acting && isSettled()) acting = false;
  draw();
  const moving =
    beltLive() ||
    motion.drawer !== want.drawer ||
    motion.lamp !== want.lamp ||
    motion.bar !== want.bar ||
    motion.flag !== want.flag ||
    motion.flip < 1 ||
    slipAt >= 0 ||
    screenMode === "waiting" ||
    motion.glow > 0.002;
  frame = visible && (moving || touring()) ? requestAnimationFrame(tick) : 0;
  if (!frame && visible && !touring() && !still.matches && !paused) scheduleWake();
}
let wake = 0;
function scheduleWake() {
  clearTimeout(wake);
  const wait = Math.max(50, idleUntil - performance.now() + 20);
  wake = setTimeout(run, held ? 400 : wait);
}
function run() {
  if (!frame && visible) {
    last = 0;
    frame = requestAnimationFrame(tick);
  }
}
new IntersectionObserver(
  (entries) => {
    visible = entries[entries.length - 1].isIntersecting;
    if (visible) run();
  },
  { rootMargin: "120px 0px" },
).observe(stage);

// ---------------------------------------------------------------- input
const QUIET = 6000;
function act(next) {
  idleUntil = performance.now() + QUIET;
  tourClock = 0;
  acting = true;
  setState(next, { announce: true });
}
const toggle = () => act(toggleCode(st));
const fix = () => act(fixDoc(st));
hots.code.addEventListener("click", toggle);
hots.archcode.addEventListener("click", toggle);
hots.page.addEventListener("click", fix);
hots.held.addEventListener("click", fix);
hots.guide.addEventListener("click", () => act(v.phase === "drift" ? fixDoc(st) : ask(st)));
hots.terminal.addEventListener("click", () => act(ask(st)));
for (const [name, el] of Object.entries(hots)) {
  const on = () => card.setAttribute("data-hover", name);
  const off = () => card.removeAttribute("data-hover");
  el.addEventListener("pointerenter", on);
  el.addEventListener("pointerleave", off);
  el.addEventListener("focus", on);
  el.addEventListener("blur", off);
}
card.addEventListener("pointerenter", () => {
  held = true;
});
card.addEventListener("pointerleave", () => {
  held = false;
  idleUntil = Math.max(idleUntil, performance.now() + 3600);
  run();
});
card.addEventListener("focusin", () => {
  held = true;
  if (!status.textContent) status.textContent = describe();
});
card.addEventListener("focusout", (event) => {
  if (card.contains(event.relatedTarget)) return;
  held = false;
  idleUntil = Math.max(idleUntil, performance.now() + 3600);
  run();
});
function setPaused(next) {
  paused = next;
  pauseButton.setAttribute("aria-pressed", String(paused));
  pauseLabel.textContent = paused ? "Play" : "Pause";
  card.toggleAttribute("data-paused", paused);
  if (!paused) idleUntil = 0;
  run();
}
pauseButton.addEventListener("click", () => setPaused(!paused));
const syncStill = () => {
  pauseButton.hidden = still.matches;
  run();
};
still.addEventListener("change", syncStill);
narrow.addEventListener("change", applyFrame);

// ---------------------------------------------------------------- theme and host frame
function themeOf() {
  if (window.__bcTheme) return window.__bcTheme;
  const query = new URLSearchParams(location.search).get("theme");
  if (query === "light" || query === "dark") return query;
  try {
    const host = window.parent !== window ? window.parent.document.documentElement : null;
    if (host && host.classList.contains("light")) return "light";
    if (host && host.classList.contains("dark")) return "dark";
  } catch {}
  return matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
}
function applyTheme() {
  const theme = themeOf();
  html.setAttribute("data-theme", theme);
  html.style.colorScheme = theme;
}
matchMedia("(prefers-color-scheme: light)").addEventListener("change", applyTheme);
try {
  if (window.parent !== window) new MutationObserver(applyTheme).observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ["class", "style"] });
} catch {}
function reportHeight() {
  if (window.parent === window) return;
  const height = Math.ceil(document.querySelector(".bc-figure").getBoundingClientRect().height + 4);
  try {
    window.parent.postMessage({ type: "doc-bridge-bridge-conveyor-height", height }, location.origin);
  } catch {}
}
if ("ResizeObserver" in window) new ResizeObserver(reportHeight).observe(card);

// ---------------------------------------------------------------- start
applyTheme();
applyFrame();
syncStill();
setState(st);
draw();
reportHeight();
// Test hooks: the e2e check drives the figure through its states without waiting for the tour.
window.__bridge = {
  state: () => ({ ...v, code: VERSIONS[st.code], cites: VERSIONS[st.doc], frame: frameName, flagged, held: heldCard >= 0, belt: Math.round(u * 100) / 100 }),
  ask: () => act(ask(st)),
  toggle: () => act(toggleCode(st)),
  fix: () => act(fixDoc(st)),
  reset: () => act(initial()),
  pause: (value = true) => setPaused(value),
  settled: isSettled,
};
</script></body></html>
